apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cxr-edge-triage-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: cxr-edge-triage
      rules:
        - alert: ConfidenceDrift
          expr: abs(increase(cxr_site_confidence_sum[1h]) / clamp_min(increase(cxr_site_confidence_count[1h]), 1) - increase(cxr_site_confidence_sum[24h]) / clamp_min(increase(cxr_site_confidence_count[24h]), 1)) > 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Mean confidence shifted from its prior baseline"
            description: "A mean-confidence shift is a coarse drift screen, not proof of model failure."
        - alert: OODRejectionSpike
          expr: increase(cxr_ood_total{decision="abstain"}[15m]) > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OOD abstentions increased"
        - alert: WorkerMemoryLeak
          expr: process_resident_memory_bytes{job=~".*worker.*"} > 7e9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Worker resident memory is above the configured threshold"
        - alert: DeadLetterBacklog
          expr: rabbitmq_queue_messages{queue="infer.dead.q"} > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Dead-letter queue has a backlog"
        - alert: SlowTriage
          expr: histogram_quantile(0.95, sum by (le) (rate(cxr_stage_seconds_bucket{stage="inference"}[10m]))) > 30
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Inference p95 latency exceeded 30 seconds"
