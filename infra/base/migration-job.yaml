apiVersion: batch/v1
kind: Job
metadata:
  name: rad-db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rad-db-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/kinshuk18/rad-api:stable
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/python3", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rad-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
