apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-worker
    spec:
      priorityClassName: ml-inference
      terminationGracePeriodSeconds: 120
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/kinshuk18/rad-worker:stable
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "worker.main"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: rad-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: DATABASE_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: AMQP_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: REDIS_URL
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: S3_ENDPOINT_URL
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rad-runtime-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: MODEL_PATH
              value: /app/models/model.pt
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ml-worker-metrics
spec:
  selector:
    app.kubernetes.io/name: ml-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
