apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rad-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rad-api.example.invalid
      secretName: rad-api-tls
  rules:
    - host: rad-api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rad-api
                port:
                  number: 80
